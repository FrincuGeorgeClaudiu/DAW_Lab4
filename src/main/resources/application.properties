spring.application.name=library-app
library.name=City Library

spring.datasource.url=jdbc:sqlite:library.db?foreign_keys=on&date_class=TEXT&date_string_format=yyyy-MM-dd
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.column_ordering_strategy=legacy
spring.jpa.open-in-view=false
